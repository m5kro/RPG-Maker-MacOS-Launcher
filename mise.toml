[tools]
python = "3.11.18"
go = "1.27.3"

[settings]
python.venv_stdlib = true

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install Python development dependencies into .venv"
run = "python -m pip install -r requirements-dev.txt"

[tasks.build]
description = "Build and check the macOS arm64-only NW.js helper"
run = "sh scripts/build-nwjs-helper.sh"

[tasks.test]
description = "Run Go and offscreen Python/Qt tests"
depends = ["build"]
run = [
  "go test ./...",
  "go test -race ./...",
  "go vet ./...",
  "QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v",
]

[tasks.run]
description = "Launch the Apple Silicon arm64-only Python GUI with the built NW.js helper"
depends = ["build"]
run = "python main.py"
